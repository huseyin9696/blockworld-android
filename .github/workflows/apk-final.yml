name: APK FIXED

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - run: unzip -o BlockWorld_Android_0.3_AdminGratis.zip

      - name: BuildConfig Fehler reparieren
        run: |
          sed -i 's/BuildConfig.DEBUG/false/g' BlockWorld_Android_0.3_AdminGratis/app/src/main/java/com/blockworld/game/MainActivity.java
          sed -i 's/BuildConfig.VERSION_NAME/"0.3.0-adminfree-debug"/g' BlockWorld_Android_0.3_AdminGratis/app/src/main/java/com/blockworld/game/MainActivity.java

      - run: gradle --no-daemon assembleDebug
        working-directory: BlockWorld_Android_0.3_AdminGratis

      - uses: actions/upload-artifact@v4
        with:
          name: BlockWorld-APK
          path: BlockWorld_Android_0.3_AdminGratis/app/build/outputs/apk/debug/*.apk
          
